# Cloudflare Workers configuration.
#
# Secrets NEVER live in this file (SECURITY §7). Local dev reads them from
# .dev.vars (gitignored); production uses `wrangler secret put`.

name = "tallyup"
main = "src/index.ts"
# Pinned to the newest date the workerd bundled with the test runner accepts,
# so `npm test` and `wrangler deploy` agree on runtime behavior. Raise it
# only after the Vitest pool ships a workerd that supports the newer date.
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The reference web client, served as static assets from this same Worker.
#
# Same origin as the API, so the browser never makes a cross-origin request
# and the CORS allow-list below applies only to third-party clients. Static
# asset requests are also free and do not count against the Worker request
# budget (docs/02-ARCHITECTURE.md §3).
#
# `not_found_handling` is deliberately left at its default: turning on
# single-page-application mode would rewrite every unmatched path to
# index.html, including a mistyped `/v1/...`, hiding real 404s from API
# clients. The client uses hash routing instead, which never reaches here.
[assets]
directory = "./web"

# Non-secret configuration. Override per environment.
[vars]
ENVIRONMENT = "development"
# Comma-separated CORS allow-list. Never "*" for authenticated routes
# (SECURITY §6). Set the real origins of whatever frontend calls this.
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000"
# PBKDF2 iteration count for new password hashes.
#
# Left unset on purpose: the shipped value is the benchmarked constant in
# src/crypto.ts, so there is only one number to keep honest. Set this only to
# override it -- for example after moving to Workers Paid, where the CPU
# budget stops being 10 ms and a far higher count becomes affordable.
# test/cpu-budget.test.ts is what proves whatever value is in force fits.
# PBKDF2_ITERATIONS = "600000"

[[d1_databases]]
binding = "DB"
database_name = "tallyup-db"
# Run `wrangler d1 create tallyup-db` and paste the returned id here.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.production]
name = "tallyup"

[env.production.assets]
directory = "./web"

[env.production.vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://REPLACE_WITH_YOUR_FRONTEND_ORIGIN"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tallyup-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
