# Cloudflare Workers configuration.
#
# Event data is encrypted in the browser; the server stores only ciphertext
# (docs/05-SECURITY.md §2). Its two secrets guard against abuse and cannot
# read anything. They live in .dev.vars locally and come from
# `wrangler secret put` in production, never from this file:
#   TURNSTILE_SECRET   Cloudflare Turnstile secret key
#   PASS_SECRET        signs client passes

name = "tallyup"
main = "src/index.ts"
# Once a custom domain is attached, turn the workers.dev address off so
# nobody can reach the Worker around the domain's WAF rules
# (docs/06-DEPLOYMENT.md §9):
# workers_dev = false
# Pinned to the newest date the workerd bundled with the test runner accepts,
# so `npm test` and `wrangler deploy` agree on runtime behavior. Raise it
# only after the Vitest pool ships a workerd that supports the newer date.
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The PWA, built by `npm run build` into ./dist and served as static assets
# from this same Worker. Same origin as the API, one deploy, and static
# asset requests do not count against the Worker request budget
# (docs/02-ARCHITECTURE.md §3). Security headers for these files come from
# web/public/_headers, because asset responses never pass through Hono.
#
# `not_found_handling` is left at its default: single-page-application mode
# would rewrite a mistyped `/v1/...` to index.html. The app uses hash
# routing, which never reaches the server.
[assets]
directory = "./dist"

# Daily sweep of expired shares and rate-limit windows (src/index.ts).
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "development"
# New shares are refused above this database size (src/routes/shares.ts).
# D1 Free caps a database at 500 MB; raise this after moving to Workers Paid.
DB_SOFT_LIMIT_MB = "450"

[[d1_databases]]
binding = "DB"
database_name = "tallyup-db"
# Run `wrangler d1 create tallyup-db` and paste the returned id here.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.production]
name = "tallyup"

[env.production.assets]
directory = "./dist"

[env.production.triggers]
crons = ["0 3 * * *"]

[env.production.vars]
ENVIRONMENT = "production"
DB_SOFT_LIMIT_MB = "450"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tallyup-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
