<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Reference client for the Tallyup API: split shared expenses and settle up in the fewest payments, with every API call visible."
    />
    <meta name="theme-color" content="#6c5ce7" />
    <title>Tallyup</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%236c5ce7'/><text x='16' y='23' font-size='19' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>%E2%82%B8</text></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="shell" id="shell">
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <div id="tabbar-slot"></div>

    <!-- Announced politely so errors reach screen readers without
         interrupting whatever the user is doing. -->
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
