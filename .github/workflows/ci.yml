name: CI

# NFR-404: lint, typecheck and the full suite gate every pull request.
# Configure branch protection on `main` to require this workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Runs the suite with coverage so NFR-501's 80% service-layer floor is
      # enforced by the merge gate rather than checked by hand. The
      # thresholds live in vitest.config.ts and fail the run when breached.
      - run: npm run test:coverage

      # Surfaces known advisories without failing the build on a transitive
      # dev-only finding. Dependabot (NFR-503) is what actually opens the
      # upgrade PRs.
      - run: npm audit --omit=dev
        continue-on-error: true
